name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  verify:
    # Name order must match main branch protection required checks:
    # "CI / verify (22, ubuntu-latest)" etc.
    name: verify (${{ matrix.node }}, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 = oldest supported (engines.node), 24 = development pin (.nvmrc)
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - run: npm run lint

      - run: npm run build

      - run: npm test

      - run: npm run wiki:lint

      - run: npm run wiki:check
