name: Bug report
description: Report a problem with the simulator or npm package
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please do not use this form for security issues — see the [security policy](https://github.com/lggarrison/landord-ts/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug, including what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: A minimal decklist and `run()` call if possible.
      placeholder: |
        1. const output = run({ code: `1 Opt\n1 Island`, runs: 1000, on_the_play: true, mulligan_down_to: 5, mulligan_on_lands: [0,1,6,7], acceptable_hand_list: [] })
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version from package.json, or the git SHA you installed.
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: e.g. v24.18.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: e.g. Windows 11, macOS 14, Ubuntu 24.04
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: >-
        Paste any stack traces or unexpected `run()` output (for example unexpected
        card_observations probabilities).
      render: shell
